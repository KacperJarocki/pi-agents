name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'sensors/rust-sensor/**'
      - 'flink/detection-job/**'
      - 'schemas/events/v2/**'
      - '.github/workflows/docker-build.yml'
      - 'scripts/trivy-scan.sh'
      - '.trivyignore'
  pull_request:
    paths:
      - 'images/**'
      - 'sensors/rust-sensor/**'
      - 'flink/detection-job/**'
      - 'schemas/events/v2/**'
      - '.github/workflows/docker-build.yml'
      - 'scripts/trivy-scan.sh'
      - '.trivyignore'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      tag: sha-${{ steps.tag.outputs.short }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - image_dir: images/gateway-agent
            image_name: gateway-agent
          - image_dir: sensors/rust-sensor
            image_name: rust-sensor
          # Built from the repository root: the job compiles schemas/events/v2.
          - image_dir: flink/detection-job
            image_name: flink-detection-job
            context: .
          - image_dir: images/incident-projector
            image_name: incident-projector
            context: .
          - image_dir: images/incident-api
            image_name: incident-api
          - image_dir: images/flow-replay
            image_name: flow-replay

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: echo "short=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Determine image name
        id: image_name
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          REPO_OWNER_LOWER=$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME_LOWER=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "name=${REPO_OWNER_LOWER}/${IMAGE_NAME_LOWER}" >> "$GITHUB_OUTPUT"
          echo "Image: ghcr.io/${REPO_OWNER_LOWER}/${IMAGE_NAME_LOWER}"

      - name: Build and push
        env:
          IMAGE_NAME: ${{ steps.image_name.outputs.name }}
          SHA_SHORT: ${{ github.sha }}
        run: |
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          echo "Building and pushing multi-platform Docker image"
          echo "From directory: ${{ matrix.image_dir }} (context: ${{ matrix.context || matrix.image_dir }})"
          echo "To: ghcr.io/${IMAGE_NAME}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR build: build-only (no push)"
            docker buildx build \
              --platform linux/amd64 \
              --tag "ghcr.io/${REPO_OWNER_LOWER}/${{ matrix.image_name }}:pr-${{ github.event.number }}" \
              --load \
              --file "${{ matrix.image_dir }}/Dockerfile" \
              "${{ matrix.context || matrix.image_dir }}"
          else
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "ghcr.io/${REPO_OWNER_LOWER}/${{ matrix.image_name }}:latest" \
              --tag "ghcr.io/${REPO_OWNER_LOWER}/${{ matrix.image_name }}:sha-${SHA_SHORT:0:8}" \
              --push \
              --file "${{ matrix.image_dir }}/Dockerfile" \
              "${{ matrix.context || matrix.image_dir }}"
          fi

      # Second line of defence after npm audit and Dependabot: known
      # vulnerabilities in the built image (OS packages and app deps). Findings
      # go to the job summary and, on main, to code scanning (Security tab).
      # A fixable CRITICAL fails the build (and so blocks the dev deploy):
      # bump the base image, or accept it in .trivyignore with a reason.
      - name: Scan image (Trivy)
        env:
          TRIVY_FAIL_ON: CRITICAL
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image_name }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
          SHA: ${{ github.sha }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          if [ "$EVENT" = "pull_request" ]; then
            ref="ghcr.io/${owner}/${IMAGE}:pr-${PR_NUMBER}"   # loaded into the local daemon
          else
            ref="ghcr.io/${owner}/${IMAGE}:sha-${SHA:0:8}"
            export TRIVY_PLATFORM=linux/arm64                 # what the Pis run
          fi
          scripts/trivy-scan.sh "$ref" trivy-out >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy results to code scanning
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-out/trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-out/trivy.sarif
          category: trivy-${{ matrix.image_name }}

      - name: Display build success
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
          SHA_SHORT: ${{ github.sha }}
        run: |
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "Multi-platform Docker image built and pushed successfully!"
          echo "Image: ghcr.io/${REPO_OWNER_LOWER}/${IMAGE_NAME}:latest"
          echo "Image: ghcr.io/${REPO_OWNER_LOWER}/${IMAGE_NAME}:sha-${SHA_SHORT:0:8}"
          echo "Platforms: linux/amd64, linux/arm64"

  # Continuous deployment to dev: pin the freshly built tags in
  # k8s/envs/dev/images.yaml. Argo CD then rolls iot-security-dev. Prod is
  # untouched until the "Promote to prod" workflow opens a PR.
  bump-dev:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Builds of two quick merges can finish out of order. One bump at a time,
    # and a build never replaces a newer one already running in dev.
    concurrency:
      group: bump-dev
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skip if dev already runs a newer build
        id: newer
        run: |
          current=$(yq '.incidents.api.image.tag' k8s/envs/dev/images.yaml)
          current=${current#sha-}
          if [ "sha-$current" != "$TAG" ] && git cat-file -e "${current}^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$GITHUB_SHA" "$current"; then
            echo "dev runs sha-$current, which already contains $GITHUB_SHA; not going back to $TAG"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin the new tags in dev
        if: steps.newer.outputs.skip != 'true'
        run: |
          f=k8s/envs/dev/images.yaml
          yq -i '
            .flink.detectionJob.image.tag = strenv(TAG) |
            .sensor.image.tag = strenv(TAG) |
            .incidents.projector.image.tag = strenv(TAG) |
            .incidents.api.image.tag = strenv(TAG) |
            .flowReplay.image.tag = strenv(TAG)
          ' "$f"
          helm template pi-agents charts/pi-agents -n iot-security-dev \
            -f k8s/envs/base.yaml -f k8s/envs/dev/values.yaml -f "$f" > /dev/null
          git diff --stat

      - name: Commit and push
        if: steps.newer.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/envs/dev/images.yaml
          git diff --cached --quiet && { echo "dev already on $TAG"; exit 0; }
          git commit -m "chore(dev): deploy $TAG"
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
