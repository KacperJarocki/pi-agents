{{- if .Values.flink.enabled }}
{{- $backend := .Values.flink.checkpoint.backend }}
{{- if not (has $backend (list "longhorn" "s3")) }}
{{- fail "flink.checkpoint.backend must be longhorn or s3" }}
{{- end }}
{{- if eq $backend "s3" }}
{{- $_ := required "flink.checkpoint.s3.bucket is required" .Values.flink.checkpoint.s3.bucket }}
{{- $_ := required "flink.checkpoint.s3.credentialsSecret is required" .Values.flink.checkpoint.s3.credentialsSecret }}
{{- end }}
{{- $endpoint := .Values.flink.checkpoint.s3.endpoint | default (printf "http://%s-rustfs:9000" (include "pi-agents.fullname" .)) }}
{{- $root := "file:///flink-state" }}
{{- if eq $backend "s3" }}
{{- $root = printf "s3://%s/%s" .Values.flink.checkpoint.s3.bucket (.Values.flink.checkpoint.s3.prefix | trimAll "/") }}
{{- end }}
{{- if eq $backend "longhorn" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pi-agents.fullname" . }}-flink-state
  labels:
    {{- include "pi-agents.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: {{ .Values.flink.checkpoint.longhorn.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.flink.checkpoint.longhorn.size | quote }}
---
{{- end }}
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: {{ include "pi-agents.fullname" . }}-flink
  labels:
    {{- include "pi-agents.labels" . | nindent 4 }}
spec:
  {{- $job := .Values.flink.detectionJob }}
  {{- if $job.enabled }}
  image: "{{ $job.image.repository }}:{{ required "flink.detectionJob.image.tag is required" $job.image.tag }}"
  {{- else }}
  image: {{ .Values.flink.image | quote }}
  {{- end }}
  flinkVersion: {{ .Values.flink.version }}
  serviceAccount: flink
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: {{ .Values.flink.taskSlots | quote }}
    execution.checkpointing.interval: {{ .Values.flink.checkpoint.interval | quote }}
    state.checkpoints.dir: {{ printf "%s/checkpoints" $root | quote }}
    state.savepoints.dir: {{ printf "%s/savepoints" $root | quote }}
    high-availability.type: kubernetes
    high-availability.storageDir: {{ printf "%s/ha" $root | quote }}
    {{- if .Values.flink.monitoring.enabled }}
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249"
    {{- end }}
    {{- if eq $backend "s3" }}
    s3.endpoint: {{ $endpoint | quote }}
    s3.path.style.access: "true"
    {{- end }}
  podTemplate:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/gateway
                    operator: DoesNotExist
      securityContext:
        runAsUser: 9999
        runAsGroup: 9999
        fsGroup: 9999
      containers:
        - name: flink-main-container
          {{- if .Values.flink.monitoring.enabled }}
          ports:
            - name: metrics
              containerPort: 9249
              protocol: TCP
          {{- end }}
          {{- if eq $backend "longhorn" }}
          volumeMounts:
            - name: flink-state
              mountPath: /flink-state
          {{- else }}
          env:
            - name: ENABLE_BUILT_IN_PLUGINS
              value: flink-s3-fs-hadoop-1.20.5.jar
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.flink.checkpoint.s3.credentialsSecret | quote }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.flink.checkpoint.s3.credentialsSecret | quote }}
                  key: AWS_SECRET_ACCESS_KEY
          {{- end }}
      {{- if eq $backend "longhorn" }}
      volumes:
        - name: flink-state
          persistentVolumeClaim:
            claimName: {{ include "pi-agents.fullname" . }}-flink-state
      {{- end }}
  jobManager:
    resources:
      {{- toYaml .Values.flink.jobManager | nindent 6 }}
  taskManager:
    replicas: {{ .Values.flink.taskManagerReplicas }}
    resources:
      {{- toYaml .Values.flink.taskManager | nindent 6 }}
  {{- if $job.enabled }}
  job:
    jarURI: local:///opt/flink/usrlib/detection-job.jar
    entryClass: io.piagents.detection.DetectionJob
    parallelism: {{ $job.parallelism }}
    # Restore from the latest checkpoint (Kubernetes HA metadata) on upgrade.
    # savepoint mode needs a healthy job to take the savepoint, so a stuck
    # job could never be upgraded out of its failure.
    upgradeMode: last-state
    allowNonRestoredState: {{ $job.allowNonRestoredState }}
    state: running
    args:
      - --bootstrap
      - {{ $job.kafkaBootstrap | default .Values.kafka.bootstrapServers | default (printf "%s-kafka-bootstrap:9092" .Values.kafka.name) | quote }}
      - --open-threshold-60s
      - {{ $job.rule.openThreshold60s | quote }}
      - --open-threshold-900s
      - {{ $job.rule.openThreshold900s | quote }}
      - --clear-fraction
      - {{ $job.rule.clearFraction | quote }}
      - --hold-ms
      - {{ $job.rule.holdMs | int64 | quote }}
      - --cooldown-ms
      - {{ $job.rule.cooldownMs | int64 | quote }}
  {{- else if .Values.flink.smokeJob }}
  job:
    jarURI: local:///opt/flink/examples/streaming/StateMachineExample.jar
    parallelism: 1
    upgradeMode: last-state
    state: running
  {{- end }}
{{- if .Values.flink.monitoring.enabled }}
{{- $m := .Values.flink.monitoring }}
{{- $flink := printf "%s-flink" (include "pi-agents.fullname" .) }}
{{- $ns := .Release.Namespace | quote }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $flink }}
  labels:
    app.kubernetes.io/component: flink
    {{- include "pi-agents.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ $flink }}
      type: flink-native-kubernetes
  podMetricsEndpoints:
    - port: metrics
      interval: {{ $m.interval | default "30s" }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $flink }}
  labels:
    app.kubernetes.io/component: flink
    {{- include "pi-agents.labels" . | nindent 4 }}
spec:
  groups:
    - name: pi-agents-flink
      rules:
        - alert: DetectionJobNotRunning
          # absent(): the JobManager itself is gone (or not scraped).
          expr: >-
            max(flink_jobmanager_numRunningJobs{namespace={{ $ns }}}) < 1
            or absent(flink_jobmanager_numRunningJobs{namespace={{ $ns }}})
          for: 5m
          labels:
            severity: warning
            {{- range $k, $v := $m.alertLabels }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
          annotations:
            summary: "The Flink detection job is not running"
            description: >-
              No Flink job has been running in {{ .Release.Namespace }} for 5 minutes.
              Traffic is still captured, but nothing is evaluating it.
        - alert: DetectionJobRestarting
          expr: >-
            max(increase(flink_jobmanager_job_numRestarts{namespace={{ $ns }}}[15m])) > {{ $m.maxRestarts | default 3 }}
          labels:
            severity: warning
            {{- range $k, $v := $m.alertLabels }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
          annotations:
            summary: "The Flink detection job keeps restarting"
            description: >-
              More than {{ $m.maxRestarts | default 3 }} restarts in 15 minutes in {{ .Release.Namespace }}.
              Check the JobManager log for the failing operator.
        - alert: DetectionJobCheckpointsFailing
          expr: >-
            max(increase(flink_jobmanager_job_numberOfFailedCheckpoints{namespace={{ $ns }}}[15m])) > {{ $m.maxFailedCheckpoints | default 3 }}
          labels:
            severity: warning
            {{- range $k, $v := $m.alertLabels }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
          annotations:
            summary: "The Flink detection job is failing its checkpoints"
            description: >-
              More than {{ $m.maxFailedCheckpoints | default 3 }} failed checkpoints in 15 minutes in {{ .Release.Namespace }}.
              A restart would replay from an old checkpoint; check the object store and the TaskManager.
{{- end }}
{{- end }}
