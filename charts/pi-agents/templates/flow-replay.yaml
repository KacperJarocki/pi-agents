{{- if .Values.flowReplay.enabled }}
{{- $r := .Values.flowReplay }}
{{- $target := $r.targetBootstrapServers | default .Values.kafka.bootstrapServers | default (printf "%s-kafka-bootstrap:9092" .Values.kafka.name) }}
# Daily copy of the last window of traffic.flows.v2 from another environment's
# Kafka (prod) into this one (dev). Prod is only read; see images/flow-replay.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "pi-agents.fullname" . }}-flow-replay
  labels:
    app.kubernetes.io/component: flow-replay
    {{- include "pi-agents.labels" . | nindent 4 }}
spec:
  schedule: {{ $r.schedule | quote }}
  timeZone: {{ $r.timeZone | quote }}
  # A second run of the same window would only produce late events.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ $r.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/component: flow-replay
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/gateway
                        operator: DoesNotExist
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
          containers:
            - name: replay
              image: "{{ $r.image.repository }}:{{ required "flowReplay.image.tag is required" $r.image.tag }}"
              env:
                - name: SOURCE_BOOTSTRAP
                  value: {{ required "flowReplay.sourceBootstrapServers is required" $r.sourceBootstrapServers | quote }}
                - name: TARGET_BOOTSTRAP
                  value: {{ $target | quote }}
                - name: SOURCE_LABEL
                  value: {{ $r.sourceLabel | quote }}
                - name: WINDOW_HOURS
                  value: {{ $r.windowHours | quote }}
                - name: MAX_RATE
                  value: {{ $r.maxRate | quote }}
                - name: MAX_MESSAGES
                  value: {{ $r.maxMessages | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml $r.resources | nindent 16 }}
{{- end }}
