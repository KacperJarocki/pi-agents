{{- if .Values.incidents.enabled }}
{{- $name := printf "%s-incidents" (include "pi-agents.fullname" .) }}
{{- $dbSecret := .Values.incidents.databaseSecret | default (printf "%s-pg-app" (include "pi-agents.fullname" .)) }}
{{- $bootstrap := .Values.kafka.bootstrapServers | default (printf "%s-kafka-bootstrap:9092" .Values.kafka.name) }}
{{- $p := .Values.incidents.projector }}
{{- $a := .Values.incidents.api }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-projector
  labels:
    app.kubernetes.io/component: incident-projector
    {{- include "pi-agents.labels" . | nindent 4 }}
spec:
  # Exactly one writer: feed cursors must commit in order.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: incident-projector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: incident-projector
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/gateway
                    operator: DoesNotExist
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: projector
          image: "{{ $p.image.repository }}:{{ required "incidents.projector.image.tag is required" $p.image.tag }}"
          env:
            - name: KAFKA_BOOTSTRAP
              value: {{ $bootstrap | quote }}
            - name: HEARTBEAT_FILE
              value: /tmp/heartbeat
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret | quote }}
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 120
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml $p.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-api
  labels:
    app.kubernetes.io/component: incident-api
    {{- include "pi-agents.labels" . | nindent 4 }}
spec:
  replicas: {{ $a.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: incident-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: incident-api
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/gateway
                    operator: DoesNotExist
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: api
          image: "{{ $a.image.repository }}:{{ required "incidents.api.image.tag is required" $a.image.tag }}"
          env:
            - name: PORT
              value: "8080"
            {{- with $a.gatewayAgentUrl }}
            - name: GATEWAY_AGENT_URL
              value: {{ . | quote }}
            {{- end }}
            - name: DEVICE_BLOCKING
              value: {{ $a.deviceBlocking | default false | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret | quote }}
                  key: uri
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $a.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-api
  labels:
    app.kubernetes.io/component: incident-api
    {{- include "pi-agents.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: incident-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if $a.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-api
  labels:
    app.kubernetes.io/component: incident-api
    {{- include "pi-agents.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $a.ingress.clusterIssuer | quote }}
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ $a.ingress.host | quote }}
      secretName: {{ $name }}-api-tls
  rules:
    - host: {{ $a.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-api
                port:
                  name: http
{{- end }}
{{- if $a.monitoring.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}-api
  labels:
    app.kubernetes.io/component: incident-api
    {{- include "pi-agents.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: incident-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ $a.monitoring.interval | default "30s" }}
{{- if $a.monitoring.portScan.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $name }}-threats
  labels:
    app.kubernetes.io/component: incident-api
    {{- include "pi-agents.labels" . | nindent 4 }}
spec:
  groups:
    - name: pi-agents-threats
      rules:
        - alert: PortScanActive
          # One series per incident severity; max by keeps labels clean so the
          # alert resolves when the gauge drops to 0.
          expr: max by (incident_severity) (pi_agents_active_incidents{rule_id="port-scan"}) > 0
          for: {{ $a.monitoring.portScan.for | default "2m" | quote }}
          labels:
            severity: warning
            {{- range $k, $v := $a.monitoring.alertLabels }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
          annotations:
            summary: "Port scan active on the IoT network"
            description: >-
              A device is being flagged as port scanning (incident severity
              {{`{{ $labels.incident_severity }}`}}). Open the dashboard: {{ $a.monitoring.portScan.dashboardUrl }}
{{- end }}
{{- end }}
{{- end }}
