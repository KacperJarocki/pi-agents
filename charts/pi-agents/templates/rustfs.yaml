{{- if .Values.rustfs.enabled }}
{{- $name := printf "%s-rustfs" (include "pi-agents.fullname" .) }}
{{- $secret := required "rustfs.credentialsSecret is required" .Values.rustfs.credentialsSecret }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    {{- include "pi-agents.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.rustfs.storage.class | quote }}
  resources:
    requests:
      storage: {{ .Values.rustfs.storage.size | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "pi-agents.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: rustfs
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/component: rustfs
    {{- include "pi-agents.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Single node on a ReadWriteOnce local-path volume: never run two pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: rustfs
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: rustfs
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/gateway
                    operator: DoesNotExist
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: rustfs
          image: {{ .Values.rustfs.image | quote }}
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: 0.0.0.0:9000
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret | quote }}
                  key: AWS_ACCESS_KEY_ID
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret | quote }}
                  key: AWS_SECRET_ACCESS_KEY
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.rustfs.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
---
# Creates the configured buckets once RustFS answers; safe to rerun.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-buckets
  labels:
    {{- include "pi-agents.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/gateway
                    operator: DoesNotExist
      containers:
        - name: create-buckets
          image: {{ .Values.rustfs.bootstrapImage | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              endpoint="http://{{ $name }}:9000"
              for bucket in {{ join " " .Values.rustfs.buckets }}; do
                aws --endpoint-url "$endpoint" s3api head-bucket --bucket "$bucket" 2>/dev/null \
                  || aws --endpoint-url "$endpoint" s3api create-bucket --bucket "$bucket"
              done
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secret | quote }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret | quote }}
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
{{- end }}
