{{- if .Values.externalServices.existingSecret }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pi-agents.fullname" . }}-service-config
  labels:
    {{- include "pi-agents.labels" . | nindent 4 }}
data:
  EXTERNAL_SERVICES_SECRET_NAME: {{ .Values.externalServices.existingSecret | quote }}
  CONTROL_DATABASE_URL_KEY: {{ .Values.externalServices.secretKeys.controlDatabaseUrl | quote }}
  CLICKHOUSE_URL_KEY: {{ .Values.externalServices.secretKeys.clickhouseUrl | quote }}
  OBJECT_STORAGE_ENDPOINT_KEY: {{ .Values.externalServices.secretKeys.objectStorageEndpoint | quote }}
{{- end }}
