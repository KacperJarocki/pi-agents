streaming:
  enabled: false
  eventSchemaVersion: v2

externalServices:
  existingSecret: ""
  secretKeys:
    controlDatabaseUrl: control-database-url
    clickhouseUrl: clickhouse-url
    objectStorageEndpoint: object-storage-endpoint


kafka:
  enabled: false
  name: pi-agents
  version: "4.3.1"
  metadataVersion: "4.3-IV0"
  bootstrapServers: ""
  replicas: 3
  storage:
    type: persistent-claim
    class: local-path
    size: 2Gi
  # Brokers never run on nodes carrying this label with value "true".
  excludeNodeLabel: node-role.kubernetes.io/gateway
  jvmOptions:
    -Xms: 768m
    -Xmx: 768m
  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  # Changing the partition count of traffic.flows.v2 requires a replay plan.
  topics:
    - name: traffic.flows.v2
      partitions: 6
      retentionMs: 1209600000   # 14 days
    - name: traffic.features.v2
      partitions: 6
      retentionMs: 259200000    # 3 days
    - name: traffic.detections.v2
      partitions: 3
      retentionMs: 2592000000   # 30 days
    - name: traffic.health.v2
      partitions: 1
      retentionMs: 1209600000   # 14 days
    - name: traffic.late.v2
      partitions: 1
      retentionMs: 604800000    # 7 days

flink:
  enabled: false
  image: flink:1.20.5-scala_2.12-java17
  version: v1_20
  taskSlots: 1
  checkpoint:
    backend: longhorn
    interval: 10s
    longhorn:
      size: 5Gi
      storageClass: longhorn
    s3:
      endpoint: ""
      bucket: ""
      prefix: flink
      credentialsSecret: ""
  smokeJob: false
  jobManager:
    requests:
      cpu: 250m
      memory: 1024Mi
    limits:
      cpu: "1"
      memory: 1024Mi
  taskManager:
    requests:
      cpu: 250m
      memory: 1024Mi
    limits:
      cpu: "1"
      memory: 1024Mi

clickhouse:
  database: analytics

objectStorage:
  bucket: pi-agents
