streaming:
  enabled: false
  eventSchemaVersion: v2

externalServices:
  existingSecret: ""
  secretKeys:
    controlDatabaseUrl: control-database-url
    clickhouseUrl: clickhouse-url
    objectStorageEndpoint: object-storage-endpoint


kafka:
  enabled: false
  name: pi-agents
  version: "4.3.1"
  metadataVersion: "4.3-IV0"
  bootstrapServers: ""
  replicas: 3
  # Must be <= replicas; a single-broker dev cluster needs 1.
  minInsyncReplicas: 2
  storage:
    type: persistent-claim
    class: local-path
    size: 2Gi
  # Brokers never run on nodes carrying this label with value "true".
  excludeNodeLabel: node-role.kubernetes.io/gateway
  jvmOptions:
    -Xms: 768m
    -Xmx: 768m
  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  # Changing the partition count of traffic.flows.v2 requires a replay plan.
  topics:
    - name: traffic.flows.v2
      partitions: 6
      retentionMs: 1209600000   # 14 days
    - name: traffic.features.v2
      partitions: 6
      retentionMs: 259200000    # 3 days
    - name: traffic.detections.v2
      partitions: 3
      retentionMs: 2592000000   # 30 days
    - name: traffic.health.v2
      partitions: 1
      retentionMs: 1209600000   # 14 days
    - name: traffic.late.v2
      partitions: 1
      retentionMs: 604800000    # 7 days

flink:
  enabled: false
  image: flink:1.20.5-scala_2.12-java17
  version: v1_20
  taskSlots: 2
  taskManagerReplicas: 2
  checkpoint:
    # s3 (RustFS, default) or longhorn (RWX volume).
    backend: s3
    interval: 10s
    longhorn:
      size: 5Gi
      storageClass: longhorn
    s3:
      # Empty endpoint means the in-chart RustFS service.
      endpoint: ""
      bucket: pi-agents
      prefix: flink
      credentialsSecret: rustfs-credentials
  smokeJob: false
  # Detection job (flink/detection-job); replaces the smoke job when enabled.
  detectionJob:
    enabled: false
    image:
      repository: ghcr.io/kacperjarocki/flink-detection-job
      # A sha-<8 chars> tag from docker-build.yml.
      tag: ""
    parallelism: 2
    # Only for the first switch from the smoke job (its savepoint has state
    # this job does not use) or after removing an operator on purpose.
    allowNonRestoredState: false
    # Empty means kafka.bootstrapServers, then the in-chart Strimzi bootstrap.
    kafkaBootstrap: ""
    rule:
      openThreshold60s: 20
      openThreshold900s: 40
      clearFraction: 0.5
      holdMs: 60000
      cooldownMs: 300000
  jobManager:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  taskManager:
    requests:
      cpu: 500m
      memory: 2048Mi
    limits:
      cpu: "2"
      memory: 2048Mi

# Single-node S3 store for Flink checkpoints and PostgreSQL backups.
rustfs:
  enabled: false
  image: rustfs/rustfs:1.0.1
  bootstrapImage: amazon/aws-cli:2.17.0
  # Secret managed outside Git with keys AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
  credentialsSecret: rustfs-credentials
  buckets:
    - pi-agents
  storage:
    class: local-path
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Capture sensor (sensors/rust-sensor) on the Wi-Fi gateway node.
sensor:
  enabled: false
  image:
    repository: ghcr.io/kacperjarocki/rust-sensor
    # Pin to a sha-<8 chars> tag from docker-build.yml in deployed values.
    tag: latest
  interface: wlan0
  # Empty means kafka.bootstrapServers, then the in-chart Strimzi bootstrap.
  kafkaBootstrap: ""
  leasesHostPath: /var/lib/gateway-agent
  flowTableCapacity: 65536
  spool:
    hostPath: /var/lib/pi-agents-sensor/spool
    bytes: 2147483648       # 2 GiB
    segmentBytes: 67108864  # 64 MiB
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

# CloudNativePG cluster for incidents; needs the CNPG operator and the
# Barman Cloud plugin (k8s/argocd/cnpg-operator.yaml, k8s/argocd/barman-cloud.yaml).
postgres:
  enabled: false
  instances: 2
  database: incidents
  owner: incidents
  storage:
    class: local-path
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 2Gi
  backup:
    # false skips the ObjectStore, WAL archiving and the ScheduledBackup
    # (dev environments without an S3 store).
    enabled: true
    # Empty endpoint means the in-chart RustFS service.
    endpoint: ""
    bucket: pi-agents
    prefix: postgres
    credentialsSecret: rustfs-credentials
    retentionPolicy: 14d
    # Six-field cron (seconds first): daily at 03:00.
    schedule: "0 0 3 * * *"
    sidecarResources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

# Incident projector (traffic.detections.v2 -> PostgreSQL) and incident API
# (REST + WebSocket + /live page). Needs postgres.enabled or an external DB.
incidents:
  enabled: false
  # Secret with key `uri`; empty means the CNPG app secret <release>-pg-app.
  databaseSecret: ""
  projector:
    image:
      repository: ghcr.io/kacperjarocki/incident-projector
      tag: ""
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  api:
    image:
      repository: ghcr.io/kacperjarocki/incident-api
      tag: ""
    replicas: 1
    # gateway-agent base URL for DHCP leases (hostname, IP) on the device
    # overview, e.g. http://gateway-agent:7000. Empty: devices show MAC only.
    gatewayAgentUrl: ""
    # Lets the device panel block/unblock a device through the gateway-agent
    # (needs gatewayAgentUrl). The API has no authentication: enable only when
    # the dashboard is reachable by trusted users alone.
    deviceBlocking: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    ingress:
      enabled: true
      host: iot-dashboard.homelab.kacperjarocki.dev
      clusterIssuer: letsencrypt-http-prod

# Daily replay of traffic.flows.v2 from another environment's Kafka (prod) into
# this release's Kafka, so dev has real traffic to test against. Only for dev:
# never enable it in the environment named as the source.
flowReplay:
  enabled: false
  image:
    repository: ghcr.io/kacperjarocki/flow-replay
    tag: ""
  # Five-field cron in timeZone: daily at 05:00.
  schedule: "0 5 * * *"
  timeZone: Europe/Warsaw
  # Kafka to read from, e.g. pi-agents-kafka-bootstrap.iot-security.svc:9092.
  sourceBootstrapServers: ""
  # Empty means kafka.bootstrapServers of this release.
  targetBootstrapServers: ""
  sourceLabel: prod
  # Copies records with a Kafka timestamp in the last windowHours.
  windowHours: 24
  # Records per second (0 = unlimited) and per run (0 = whole window).
  maxRate: 2000
  maxMessages: 0
  activeDeadlineSeconds: 10800
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

clickhouse:
  database: analytics

objectStorage:
  bucket: pi-agents
