streaming:
  enabled: false
  eventSchemaVersion: v1

externalServices:
  existingSecret: ""
  secretKeys:
    controlDatabaseUrl: control-database-url
    clickhouseUrl: clickhouse-url
    objectStorageEndpoint: object-storage-endpoint


kafka:
  enabled: false
  name: pi-agents
  version: "4.3.1"
  metadataVersion: "4.3-IV0"
  bootstrapServers: ""
  replicas: 3
  storage:
    type: persistent-claim
    class: local-path
    size: 2Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 768Mi

flink:
  enabled: false
  image: flink:1.20.5-scala_2.12-java17
  version: v1_20
  taskSlots: 1
  checkpoint:
    backend: longhorn
    interval: 10s
    longhorn:
      size: 5Gi
      storageClass: longhorn
    s3:
      endpoint: ""
      bucket: ""
      prefix: flink
      credentialsSecret: ""
  smokeJob: false
  jobManager:
    requests:
      cpu: 250m
      memory: 1024Mi
    limits:
      cpu: "1"
      memory: 1024Mi
  taskManager:
    requests:
      cpu: 250m
      memory: 1024Mi
    limits:
      cpu: "1"
      memory: 1024Mi

clickhouse:
  database: analytics

objectStorage:
  bucket: pi-agents
