# gateway-agent with ENABLE_APPLY=true: it brings up the IoT-Security SSID
# on the gateway node as soon as it syncs. Point path at k8s/gateway for
# safe mode (no hostapd/dnsmasq changes).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-agent
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: pi-agents
  source:
    repoURL: https://github.com/KacperJarocki/pi-agents.git
    targetRevision: main
    path: k8s/overlays/gateway-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: iot-security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
