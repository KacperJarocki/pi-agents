# gateway-agent in safe mode (ENABLE_APPLY=false). Point path at
# k8s/overlays/gateway-prod to let it drive the AP for real.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-agent
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: pi-agents
  source:
    repoURL: https://github.com/KacperJarocki/pi-agents.git
    targetRevision: main
    path: k8s/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: iot-security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
