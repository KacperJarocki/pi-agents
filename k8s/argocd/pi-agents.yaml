# The platform itself (Kafka, Flink job, PostgreSQL, RustFS, sensor, incidents),
# one Application per environment from the same chart:
#   dev  -> iot-security-dev, small profile, auto-deploys every image build on main
#   prod -> iot-security, changes only through a merged promotion PR
# Values layering (later wins): envs/base.yaml < envs/<env>/values.yaml < envs/<env>/images.yaml
# prod needs the rustfs-credentials and iot-security-external-services Secrets created outside Git.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: pi-agents
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # Deleting this ApplicationSet (or an element below) never deletes an
    # environment's resources; dev adds its own finalizer via templatePatch.
    preserveResourcesOnDeletion: true
  generators:
    - list:
        elements:
          - env: dev
            name: pi-agents-dev
            namespace: iot-security-dev
            cascadeDelete: "true"
          - env: prod
            name: pi-agents
            namespace: iot-security
            cascadeDelete: "false"
  template:
    metadata:
      name: "{{ .name }}"
      labels:
        app.kubernetes.io/part-of: pi-agents
        environment: "{{ .env }}"
    spec:
      project: pi-agents
      source:
        repoURL: https://github.com/KacperJarocki/pi-agents.git
        targetRevision: main
        path: charts/pi-agents
        helm:
          releaseName: pi-agents
          valueFiles:
            - ../../k8s/envs/base.yaml
            - ../../k8s/envs/{{ .env }}/values.yaml
            - ../../k8s/envs/{{ .env }}/images.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
  templatePatch: |
    {{- if eq .cascadeDelete "true" }}
    metadata:
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    {{- end }}
