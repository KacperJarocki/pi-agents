apiVersion: v1
kind: ConfigMap
metadata:
  name: iot-security-streaming-config
  namespace: iot-security
  labels:
    app.kubernetes.io/name: iot-security
data:
  # The streaming path is opt-in until the dual-run milestone is complete.
  STREAMING_ENABLED: "false"
  EVENT_SCHEMA_VERSION: "v2"
  CLICKHOUSE_DATABASE: "analytics"
  OBJECT_STORAGE_BUCKET: "pi-agents"
  # Replace in an overlay or external deployment configuration.
  KAFKA_BOOTSTRAP_SERVERS: ""
