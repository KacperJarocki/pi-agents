# Production: namespace iot-security, the real gateway sensor, backups on.
# Small profile for 5x 8 GB Pis that also run monitoring: the chart
# defaults (design sizing) took two nodes NotReady under memory load.
kafka:
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1Gi

flink:
  taskManagerReplicas: 1
  jobManager:
    requests:
      cpu: 250m
      memory: 1024Mi
    limits:
      cpu: "1"
      memory: 1024Mi
  taskManager:
    requests:
      cpu: 500m
      memory: 1536Mi
    limits:
      cpu: "2"
      memory: 1536Mi

postgres:
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1Gi

incidents:
  api:
    # Hostnames and IPs on the device overview come from the AP's DHCP leases.
    gatewayAgentUrl: http://gateway-agent:7000
    # Block/unblock devices from the device panel. The dashboard is reachable
    # from the home LAN only (no route from outside), so no auth in front.
    deviceBlocking: true
    # Scrape /metrics and alert on active port scans via Alertmanager -> ntfy.
    # The homelab Alertmanager routes team=security to the homelab-security topic.
    monitoring:
      enabled: true
