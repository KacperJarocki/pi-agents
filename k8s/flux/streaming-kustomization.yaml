apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pi-agents-streaming
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: pi-agents
spec:
  interval: 5m
  path: ./k8s/flux
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: pi-agents
    namespace: flux-system
