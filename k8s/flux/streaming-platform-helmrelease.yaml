apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pi-agents
  namespace: iot-security
  labels:
    app.kubernetes.io/part-of: pi-agents
spec:
  interval: 5m
  # Rolling three Kafka brokers (and waiting for the Kafka CR to be Ready)
  # takes longer than Helm's default 5 minutes.
  timeout: 20m
  dependsOn:
    - name: strimzi-operator
      namespace: strimzi-system
    - name: barman-cloud
      namespace: cnpg-system
    - name: flink-operator
      namespace: iot-security
  chart:
    spec:
      chart: ./charts/pi-agents
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: pi-agents
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      # Do not roll back a timed-out Kafka roll; a rollback restarts every
      # broker again and reverts placement changes.
      remediateLastFailure: false
  values:
    streaming:
      enabled: true
    # Small profile for 5x 8 GB Pis that also run monitoring: the chart
    # defaults (design sizing) took two nodes NotReady under memory load.
    kafka:
      enabled: true
      bootstrapServers: pi-agents-kafka-bootstrap:9092
      jvmOptions:
        -Xms: 512m
        -Xmx: 512m
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 1Gi
    # Needs the rustfs-credentials Secret (AWS_ACCESS_KEY_ID,
    # AWS_SECRET_ACCESS_KEY) in iot-security, created outside Git.
    rustfs:
      enabled: true
    flink:
      enabled: true
      taskManagerReplicas: 1
      jobManager:
        requests:
          cpu: 250m
          memory: 1024Mi
        limits:
          cpu: "1"
          memory: 1024Mi
      taskManager:
        requests:
          cpu: 500m
          memory: 1536Mi
        limits:
          cpu: "2"
          memory: 1536Mi
      # Stateful example job used to verify checkpoint recovery; replaced by
      # the detection job (task 5.4).
      smokeJob: true
    sensor:
      # Paused: the image crash-loops while wlan0 is down, which blocks the
      # release; re-enable with the image from the wait-for-interface fix.
      enabled: false
      image:
        # docker-build.yml on main, linux/arm64 + amd64.
        tag: sha-1b613f8a
      interface: wlan0
    postgres:
      enabled: true
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 1Gi
    externalServices:
      existingSecret: iot-security-external-services
