apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: iot-security
  labels:
    app: gateway-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-api
  template:
    metadata:
      labels:
        app: gateway-api
    spec:
      serviceAccountName: gateway-api
      nodeSelector:
        node-role.kubernetes.io/gateway: "true"
      containers:
        - name: gateway-api
          image: ghcr.io/kacperjarocki/gateway-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          env:
            - name: CONTROL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: iot-security-external-services
                  key: control-database-url
                  optional: true
            - name: CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: iot-security-external-services
                  key: clickhouse-url
                  optional: true
            - name: OBJECT_STORAGE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: iot-security-external-services
                  key: object-storage-endpoint
                  optional: true
            - name: DATABASE_PATH
              value: "/data/iot-security.db"
            - name: MODEL_PATH
              value: "/data/models"
            - name: LOG_LEVEL
              value: "info"
          envFrom:
            - configMapRef:
                name: iot-security-streaming-config
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: iot-security-sqlite
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
